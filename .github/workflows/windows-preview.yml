name: Windows preview acceptance
on:
  push:
    branches: ['codex/windows-cloud-test', 'codex/windows-handoff-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r backend/requirements.txt -r licensing/requirements.txt -r tauri-preview/requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install ffmpeg --yes --no-progress
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m pytest -q
      - name: Frozen worker and Windows installer
        shell: pwsh
        run: |
          $env:QIYIN_PREVIEW_FFMPEG = (Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if (-not $env:QIYIN_PREVIEW_FFMPEG) { throw 'FFmpeg binary missing' }
          python tauri-preview/package_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview-internal-qa
          path: dist/windows-preview/
          retention-days: 3
