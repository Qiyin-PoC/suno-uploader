server {
    listen 8081;
    server_name 172.203.225.147;
    root /opt/qiyin-uploader-test/current/site;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location / {
        try_files $uri $uri/ =404;
    }
    location /downloads/ {
        alias /opt/qiyin-uploader-test/downloads/;
        autoindex off;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/(health|v1/|webhooks/) {
        proxy_pass http://127.0.0.1:18871;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
    }
    location ~ /\. { deny all; }
}
