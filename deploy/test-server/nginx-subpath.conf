# Include only inside the existing IP-address port 80 server block.
location = /uploader { return 308 /uploader/; }
location = /uploader/health {
    proxy_pass http://127.0.0.1:18871/health;
    include /etc/nginx/snippets/qiyin-uploader-proxy.conf;
}
location /uploader/v1/ {
    proxy_pass http://127.0.0.1:18871/v1/;
    include /etc/nginx/snippets/qiyin-uploader-proxy.conf;
}
location /uploader/webhooks/ {
    proxy_pass http://127.0.0.1:18871/webhooks/;
    include /etc/nginx/snippets/qiyin-uploader-proxy.conf;
}
location /uploader/ {
    proxy_pass http://127.0.0.1:8081/;
    include /etc/nginx/snippets/qiyin-uploader-proxy.conf;
}
